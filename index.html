<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDS TFT Diary</title>
  
  <!-- Firebase v9 호환성 SDK & Crypto 라이브러리 -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/pbkdf2.min.js"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background: #f4f6f8; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto 20px; }
    .hidden { display: none !important; }
    input[type="text"], input[type="email"], input[type="password"], input[type="number"], input[type="date"] { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 6px; }
    button { background: #4f46e5; color: white; border: none; padding: 12px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    button.danger { background: #dc2626; width: auto; }
    
    /* 탭 디자인 */
    .tab-container { display: flex; margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; }
    .tab-btn { flex: 1; padding: 10px; text-align: center; cursor: pointer; background: none; color: #6b7280; font-weight: bold; border: none; border-bottom: 3px solid transparent; width: auto; margin: 0; }
    .tab-btn.active { color: #4f46e5; border-bottom-color: #4f46e5; }
    
    .item-list { list-style: none; padding: 0; }
    .item-list li { background: #f9fafb; border: 1px solid #e5e7eb; padding: 12px; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    .summary-box { background: #eef2ff; border-left: 4px solid #4f46e5; padding: 12px; margin-top: 15px; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- 인증 영역 (로그인 전 UI) -->
  <div id="auth-section" class="card">
    <div class="tab-container">
      <button id="tab-login-btn" class="tab-btn active" onclick="switchTab('login')">로그인</button>
      <button id="tab-signup-btn" class="tab-btn" onclick="switchTab('signup')">회원가입</button>
    </div>

    <!-- 로그인 폼 -->
    <form id="login-form" onsubmit="handleLogin(event)">
      <h3 style="margin-top:0;">로그인</h3>
      <input type="email" id="login-email" placeholder="이메일 주소 (예: user@example.com)" required>
      <input type="password" id="login-password" placeholder="비밀번호" required>
      <button type="submit">로그인하기</button>
    </form>

    <!-- 회원가입 폼 -->
    <form id="signup-form" class="hidden" onsubmit="handleSignUp(event)">
      <h3 style="margin-top:0;">새 계정 회원가입</h3>
      <input type="email" id="signup-email" placeholder="사용할 이메일 주소" required>
      <input type="password" id="signup-password" placeholder="비밀번호 (6자리 이상)" required>
      <input type="password" id="signup-password-confirm" placeholder="비밀번호 확인" required>
      <button type="submit" style="background: #10b981;">회원가입 완료</button>
    </form>
  </div>

  <!-- 메인 애플리케이션 영역 (로그인 후 UI) -->
  <div id="app-section" class="card hidden">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span id="user-display-info" style="font-weight: bold;"></span>
      <button onclick="handleLogout()" class="danger">로그아웃</button>
    </div>
    <hr style="margin: 15px 0;">

    <!-- PDS 5일치 일과 기록 및 지표 계산 -->
    <h3>PDS 5일 기록 (지표: 달성률 %)</h3>
    <div>
      <input type="date" id="pds-date">
      <input type="number" id="pds-target" placeholder="목표 건수 (예: 10)">
      <input type="number" id="pds-done" placeholder="실행 건수 (예: 8)">
      <button onclick="savePDSRecord()">기록 저장</button>
    </div>

    <ul id="pds-list" class="item-list"></ul>

    <!-- 화면 자동 합계/평균 계산 대조 영역 -->
    <div class="summary-box">
      <strong>5일 기록 통계 (지표: 실행 달성률 %)</strong><br>
      총 실행 합계: <span id="stat-sum">0</span>건<br>
      평균 달성률: <span id="stat-avg">0</span>%
    </div>

    <hr style="margin: 20px 0;">

    <!-- 내보내기 & 계정 삭제 섹션 -->
    <h3>계정 데이터 관리</h3>
    <button onclick="exportUserData()" style="background: #3b82f6; width: auto;">내 데이터 파일 내보내기 (.json)</button>
    <button onclick="deleteUserAccount()" class="danger">계정 및 데이터 전체 삭제</button>
    <p style="font-size: 12px; color: #6b7280; margin-top: 5px;">
      * 계정 삭제 시 Firestore에 저장된 내 모든 기록이 즉시 제거되며 복구할 수 없습니다.
    </p>
  </div>

  <script>
    // 실제 파이베이스 설정 정보
    const firebaseConfig = {
      apiKey: "AIzaSyBigcKnHH1iioUAXJiXtCpdLzryxsTmHWw",
      authDomain: "tft-diary-2d76e.firebaseapp.com",
      projectId: "tft-diary-2d76e",
      storageBucket: "tft-diary-2d76e.firebasestorage.app",
      messagingSenderId: "425413983426",
      appId: "1:425413983426:web:a8b5f1920bfba06a064f5b",
      measurementId: "G-DDW5JEQVZM"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;

    // 세션 지속성 설정 (브라우저 세션 기반)
    auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);

    // 탭 전환 로직 (로그인 / 회원가입)
    function switchTab(type) {
      if(type === 'login') {
        document.getElementById('login-form').classList.remove('hidden');
        document.getElementById('signup-form').classList.add('hidden');
        document.getElementById('tab-login-btn').classList.add('active');
        document.getElementById('tab-signup-btn').classList.remove('active');
      } else {
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('signup-form').classList.remove('hidden');
        document.getElementById('tab-login-btn').classList.remove('active');
        document.getElementById('tab-signup-btn').classList.add('active');
      }
    }

    // 1. 인증 상태 변경 감지
    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('app-section').classList.remove('hidden');
        document.getElementById('user-display-info').innerText = `${user.email} 계정`;
        loadPDSRecords();
      } else {
        currentUser = null;
        document.getElementById('auth-section').classList.remove('hidden');
        document.getElementById('app-section').classList.add('hidden');
        document.getElementById('pds-list').innerHTML = '';
      }
    });

    // PBKDF2 단방향 해시 키 생성 함수
    function hashPassword(password, salt) {
      return CryptoJS.PBKDF2(password, salt, { keySize: 256/32, iterations: 1000 }).toString();
    }

    // 2. 회원가입
    function handleSignUp(e) {
      e.preventDefault();
      const email = document.getElementById('signup-email').value;
      const pass = document.getElementById('signup-password').value;
      const passConfirm = document.getElementById('signup-password-confirm').value;

      if (pass !== passConfirm) {
        return alert('비밀번호가 일치하지 않습니다.');
      }

      auth.createUserWithEmailAndPassword(email, pass)
        .then(userCredential => {
          alert('회원가입이 완료되어 자동으로 로그인되었습니다.');
        })
        .catch(err => alert('가입 실패: ' + err.message));
    }

    // 3. 로그인
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;

      auth.signInWithEmailAndPassword(email, pass)
        .catch(err => alert('로그인 실패: ' + err.message));
    }

    // 4. 로그아웃
    function handleLogout() {
      auth.signOut().then(() => {
        alert('로그아웃 되었습니다.');
      });
    }

    // 5. PDS 데이터 저장 (격리된 사용자별 경로 users/{uid}/pds에 저장)
    function savePDSRecord() {
      if(!currentUser) return;

      const date = document.getElementById('pds-date').value;
      const target = parseFloat(document.getElementById('pds-target').value) || 0;
      const done = parseFloat(document.getElementById('pds-done').value) || 0;

      if(!date) return alert('날짜를 선택해 주세요.');

      const rate = target > 0 ? Math.round((done / target) * 100) : 0;

      db.collection('users').doc(currentUser.uid).collection('pds').doc(date).set({
        date: date,
        target: target,
        done: done,
        rate: rate,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        loadPDSRecords();
      }).catch(err => alert('저장 권한 거절: ' + err.message));
    }

    // 6. 데이터 로드 및 통계 계산
    function loadPDSRecords() {
      if(!currentUser) return;

      db.collection('users').doc(currentUser.uid).collection('pds')
        .orderBy('date', 'asc')
        .get()
        .then(snapshot => {
          const listEl = document.getElementById('pds-list');
          listEl.innerHTML = '';
          
          let totalDone = 0;
          let totalRateSum = 0;
          let count = 0;

          snapshot.forEach(doc => {
            const data = doc.data();
            totalDone += data.done;
            totalRateSum += data.rate;
            count++;

            const li = document.createElement('li');
            li.innerHTML = `
              <span><strong>${data.date}</strong> - 목표: ${data.target}건 / 실행: ${data.done}건 (달성률: ${data.rate}%)</span>
              <button onclick="deleteRecord('${data.date}')" class="danger">삭제</button>
            `;
            listEl.appendChild(li);
          });

          // 합계 및 평균 (소수점 첫째자리 반올림)
          document.getElementById('stat-sum').innerText = totalDone;
          const avgRate = count > 0 ? (totalRateSum / count).toFixed(1) : 0;
          document.getElementById('stat-avg').innerText = avgRate;
        });
    }

    function deleteRecord(dateDoc) {
      if(!currentUser) return;
      db.collection('users').doc(currentUser.uid).collection('pds').doc(dateDoc).delete().then(() => {
        loadPDSRecords();
      });
    }

    // 7. 내 데이터 내보내기 (.json)
    function exportUserData() {
      if(!currentUser) return;

      db.collection('users').doc(currentUser.uid).collection('pds').get().then(snapshot => {
        const data = [];
        snapshot.forEach(doc => data.push(doc.data()));
        
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `pds_export_${currentUser.uid}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      });
    }

    // 8. 계정 삭제
    function deleteUserAccount() {
      if(!currentUser) return;
      if(!confirm('정말로 계정과 모든 데이터를 삭제하시겠습니까?')) return;

      const uid = currentUser.uid;
      db.collection('users').doc(uid).collection('pds').get().then(snapshot => {
        const batch = db.batch();
        snapshot.forEach(doc => batch.delete(doc.ref));
        return batch.commit();
      }).then(() => {
        return currentUser.delete();
      }).then(() => {
        alert('계정이 완전히 삭제되었습니다.');
      }).catch(err => alert('삭제 실패: ' + err.message));
    }
  </script>
</body>
</html>
